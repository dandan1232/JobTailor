services:
  jobtailor:
    build:
      context: .
    container_name: jobtailor
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "3200:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
